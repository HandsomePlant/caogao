<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>俄罗斯方块</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="game-panel">
      <h1>俄罗斯方块</h1>
      <canvas id="board" width="300" height="600" aria-label="俄罗斯方块游戏区域"></canvas>
      <p class="tips">操作：← → 移动，↑ 旋转，↓ 加速，空格瞬降，P 暂停</p>
    </section>

    <aside class="info-panel">
      <h2>游戏信息</h2>
      <p>分数：<span id="score">0</span></p>
      <p>等级：<span id="level">1</span></p>
      <p>消行：<span id="lines">0</span></p>
      <button id="restart" type="button">重新开始</button>
      <p id="status" class="status">按任意方向键开始游戏</p>
    </aside>
  </main>

  <script src="game.js"></script>
</body>
</html>
